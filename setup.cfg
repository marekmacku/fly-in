[flake8]
max-line-length = 99
extend-ignore =
    W293,
    E203
exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .venv,
    venv,
    build,
    dist,
    pages,
    maps,
    maps_download

[mypy]
strict = True
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
exclude = (pages|maps|maps_download|.venv)/
